name: Deploy to lichenprotocol.com

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A second push waits rather than interleaving uploads.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check PHP syntax
        run: |
          set -euo pipefail
          find site -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check every template placeholder is one _new.php substitutes
        run: |
          set -euo pipefail
          known='__HEADLINE__ __TO__ __TO_URL__ __FROM__ __EMAIL__ __DATE__ __SITUATION__'
          fail=0
          for f in site/_tpl/*.html; do
            for ph in $(grep -o '__[A-Z_]\+__' "$f" | sort -u); do
              case " $known " in
                *" $ph "*) ;;
                *) echo "::error file=$f::$ph is in the template but _new.php never fills it"; fail=1 ;;
              esac
            done
          done
          exit $fail

      - name: Upload over Web Disk
        env:
          WEBDISK_HOST: ${{ secrets.WEBDISK_HOST }}
          WEBDISK_USER: ${{ secrets.WEBDISK_USER }}
          WEBDISK_PASS: ${{ secrets.WEBDISK_PASS }}
          WEBDISK_DIR:  ${{ vars.WEBDISK_DIR }}
        run: |
          set -euo pipefail
          : "${WEBDISK_HOST:?set the WEBDISK_HOST repository secret}"
          : "${WEBDISK_USER:?set the WEBDISK_USER repository secret}"
          : "${WEBDISK_PASS:?set the WEBDISK_PASS repository secret}"

          # cPanel serves Web Disk (WebDAV) over TLS on 2078.
          BASE="https://${WEBDISK_HOST}:2078"

          # Paths are relative to whatever directory the Web Disk account is
          # rooted at. An account restricted to public_html/p is already there,
          # so WEBDISK_DIR should be "." for that case; an unrestricted account
          # starts at the home directory and needs the default.
          DIR="${WEBDISK_DIR:-public_html/p}"
          DIR="${DIR%/}"
          [ "$DIR" = "." ] && DIR=""
          [ -n "$DIR" ] && DIR="$DIR/"
          echo "Target: $BASE/${DIR}"

          dav() { curl -sS -m 60 --user "$WEBDISK_USER:$WEBDISK_PASS" "$@"; }

          # Fail early and legibly on a bad host, bad password or blocked port,
          # rather than part-way through the upload. PROPFIND is the WebDAV way
          # to ask "does this collection exist and may I read it" — a plain GET
          # on a collection answers 200 with an empty body on some servers and
          # 405 on others, so it cannot tell success from misconfiguration.
          code=$(dav -o /dev/null -w '%{http_code}' -X PROPFIND -H 'Depth: 0' "$BASE/${DIR}")
          case "$code" in
            207|200) echo "Connected." ;;
            401) echo "::error::401 — WEBDISK_USER or WEBDISK_PASS is wrong."; exit 1 ;;
            403) echo "::error::403 — that account cannot read ${DIR}. Check its Directory and permissions."; exit 1 ;;
            404) echo "::error::404 — ${DIR} does not exist from this account's root. Check the WEBDISK_DIR variable."; exit 1 ;;
            405) echo "::error::405 — PROPFIND refused. Is $BASE really a WebDAV endpoint?"; exit 1 ;;
            000) echo "::error::Could not reach $BASE. Is Web Disk enabled, and is 2078 reachable?"; exit 1 ;;
            *)   echo "::error::Unexpected $code from $BASE/${DIR}"; exit 1 ;;
          esac

          # MKCOL the subdirectories. 405 means it already exists, which is fine.
          while read -r d; do
            [ -z "$d" ] && continue
            code=$(dav -o /dev/null -w '%{http_code}' -X MKCOL "$BASE/${DIR}${d}/")
            case "$code" in
              201) echo "  created $d/" ;;
              405) echo "  $d/ exists" ;;
              *)   echo "::error::MKCOL $d/ returned $code"; exit 1 ;;
            esac
          done < <(cd site && find . -mindepth 1 -type d -printf '%P\n' | sort)

          # Explicit per-file PUTs. There is deliberately no mirror, sync or
          # DELETE anywhere in this job: proposal folders and _log/ are created
          # on the server at runtime and are not in this repo, so anything that
          # could remove unknown remote files would destroy live client pages.
          mapfile -t FILES < <(cd site && find . -type f -printf '%P\n' | sort)
          echo "Uploading ${#FILES[@]} files"

          for f in "${FILES[@]}"; do
            if [ "$f" = "_config.php" ]; then
              echo "::error::refusing to upload _config.php — keys live only on the server"
              exit 1
            fi
            code=$(dav -o /dev/null -w '%{http_code}' -T "site/$f" "$BASE/${DIR}$f")
            case "$code" in
              200|201|204) echo "  $f" ;;
              *) echo "::error::PUT $f returned $code"; exit 1 ;;
            esac
          done

      - name: Verify the live site
        run: |
          set -euo pipefail
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$1")
            if [ "$code" != "$2" ]; then
              echo "::error::$1 returned $code, expected $2"; return 1
            fi
            echo "  $1 -> $code"
          }
          # The directory does not list, the log is sealed, the gated pages give
          # nothing away without a key, and the retired beacon address still
          # answers 204 for pages built before tracking was switched off.
          check https://lichenprotocol.com/p/                  403
          check https://lichenprotocol.com/p/_log/sent.csv     403
          check https://lichenprotocol.com/p/_tpl/general.html 403
          check https://lichenprotocol.com/p/_tpl/invited.html 403
          check https://lichenprotocol.com/p/_new.php          404
          check https://lichenprotocol.com/p/_view.php         404
          check https://lichenprotocol.com/p/_track.php        204
